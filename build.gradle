import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id "java"
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.0.1"
    id 'io.freefair.lombok' version '8.6'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.0'
}

group = 'com.minecraftcivilizations'
version = '0.0.0.1'

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://hub.spigotmc.org/nexus/repositories/snapshots/' }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = "https://repo.aikar.co/content/groups/aikar/"
        name = "aikar"
    }
    maven {
        name = "arclight-repo"
        url = "https://maven.izzel.io/releases/"
    }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url = "https://repo.codemc.io/repository/nms/" }
    maven {
        url = "https://jitpack.io"
    }
    repositories {
        maven { url "https://repo.codemc.io/repository/maven-public/" }
    }
}

configurations {
    shadow
}

dependencies {
    compileOnly 'org.spigotmc:spigot:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:3.2.38'
    compileOnly 'org.spigotmc:spigot:1.20.1-R0.1-SNAPSHOT:remapped-mojang'

    implementation 'com.typesafe:config:1.4.3'
    compileOnly "io.izzel.arclight:arclight-api:1.7.4"
    compileOnly "org.spigotmc:minecraft-server:1.20.1-R0.1-SNAPSHOT"
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "com.github.Virtuoel:Pehkui:3.8.2-1.20.1-forge"

    shadow("net.kyori:adventure-text-minimessage:4.17.0")
    shadow("net.kyori:adventure-text-serializer-legacy:4.17.0")
    shadow 'net.kyori:adventure-text-serializer-gson:4.17.0'
    shadow 'net.kyori:adventure-api:4.14.0'
    shadow 'net.kyori:adventure-platform-bukkit:4.3.0'
    shadow "de.tr7zw:item-nbt-api:2.15.5"

    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
    testCompileOnly("org.projectlombok:lombok:1.18.38")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.38")
    compileOnly "com.fasterxml.jackson.core:jackson-annotations:2.17.2"

    shadow 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    shadow "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
}

jar {
    enabled = false // Disable the default JAR task
}

shadowJar {
    archiveClassifier = ''
    archiveBaseName = project.name

    configurations = [project.configurations.shadow]
    relocate 'net.kyori', 'com.minecraftcivilizations.specialization.kyori'
    relocate 'de.tr7zw', 'com.minecraftcivilizations.specialization.tr7zw'

    relocate 'co.aikar.commands', 'com.minecraftcivilizations.specialization.acf'
    relocate 'co.aikar.locales', 'com.minecraftcivilizations.specialization.locales'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.20.1")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}


tasks.register('copyPluginJar', Copy) {
    dependsOn shadowJar
    from(shadowJar.archiveFile)

    def exportPath = project.findProperty("export.path")
    onlyIf { exportPath != null }

    if (exportPath) {
        into(exportPath)
    }
}


tasks.build {
    dependsOn tasks.copyPluginJar
}
tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjdk-release=17", "-Xexpect-builtin-kotlin-types"]
    }
}